name: Build P2000 Android APK

on:
  push:
    paths:
      - "p2000-app/**"
      - ".github/workflows/p2000-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Build debug APK and run tests
        working-directory: p2000-app
        run: ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2000-live-apk
          path: p2000-app/app/build/outputs/apk/debug/app-debug.apk
